<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Apply the visitor's saved theme before the page paints (no flash). Default: follow the device. */
  (function () { try { var t = localStorage.getItem('ssvn-theme'); if (t === 'dawn' || t === 'dhuni') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
