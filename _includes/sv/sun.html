{%- comment -%}
  SunMark — the Udaya rising sun. Params: w (width in px, default 30), horizon (true to draw the horizon line).
{%- endcomment -%}
{%- assign sun_w = include.w | default: 30 -%}
{%- assign sun_h = sun_w | times: 64.0 | divided_by: 120 | round: 2 -%}
<svg class="sv-sun" width="{{ sun_w }}" height="{{ sun_h }}" viewBox="0 0 120 64" aria-hidden="true" focusable="false"><g class="sv-sun__rays"><line x1="34" y1="41" x2="23.6" y2="35"/><line x1="40.7" y1="33" x2="35.6" y2="26.9"/><line x1="49.7" y1="27.8" x2="45.6" y2="16.5"/><line x1="60" y1="26" x2="60" y2="18"/><line x1="70.3" y1="27.8" x2="74.4" y2="16.5"/><line x1="79.3" y1="33" x2="84.4" y2="26.9"/><line x1="86" y1="41" x2="96.4" y2="35"/></g><path class="sv-sun__disc" d="M38 56 A22 22 0 0 1 82 56 Z"/>{% if include.horizon %}<rect class="sv-sun__horizon" x="8" y="56" width="104" height="4" rx="2"/>{% endif %}</svg>
